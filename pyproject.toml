[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-state-core"
version = "0.1.0a2"
description = "A composable Python + SQLite core for shared state, scoped information, and action outcomes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repository = "https://github.com/zhaosknss/agent-state-core"
Issues = "https://github.com/zhaosknss/agent-state-core/issues"
Discussions = "https://github.com/zhaosknss/agent-state-core/discussions"

[project.optional-dependencies]
langgraph = ["langgraph==1.2.15"]

[tool.setuptools.packages.find]
include = ["agent_state_core*"]
